<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<title>Essencare</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--fs:1;--c-work:#EA580C;--c-kcal:#15803D;--c-water:#1565C0;--c-pee:#CA8A04;--c-pup:#92400E;--c-weight:#0F766E;--c-if:#4F46E5;--c-cycle:#DB2777;--c-lut:#7C3AED;--card:#fff;--ink:#0B2545;--blue:#1565C0;--blue2:#0D47A1;--sky:#E8F1FC;--mist:#F5F8FD;--line:#D9E4F4;--mute:#5B6F8C;--bad:#C0392B}
:root[data-theme=dark]{color-scheme:dark;--ink:#E6EEF9;--blue:#2F7FD8;--blue2:#A9D1FA;--sky:#1B2C4A;--mist:#0E1726;--card:#16223A;--line:#26385A;--mute:#9AACC8;--bad:#FF7A6B;--c-work:#FB923C;--c-kcal:#4ADE80;--c-water:#60A5FA;--c-pee:#FACC15;--c-pup:#D6A15E;--c-weight:#2DD4BF;--c-if:#818CF8;--c-cycle:#F472B6;--c-lut:#A78BFA}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font:calc(16px*var(--fs))/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--mist);-webkit-tap-highlight-color:transparent}
h1,h2,.num{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-weight:600}
#app{max-width:520px;margin:auto;min-height:100vh}
main{padding:calc(22px + env(safe-area-inset-top)) 20px 120px}
h1{font-size:calc(28px*var(--fs));line-height:1.2}
h2{font-size:calc(19px*var(--fs));margin:28px 0 10px}
.mute,li span,label{color:var(--mute)}
.mute{font-size:calc(14px*var(--fs));margin-top:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.num{font-size:calc(36px*var(--fs));line-height:1}
.note{background:var(--sky);border-radius:14px;padding:14px 16px;font-size:calc(15px*var(--fs))}
.f,.meter,.list{background:var(--card);border:1px solid var(--line);border-radius:18px}
.f{padding:16px;display:grid;gap:12px;margin-top:16px}
.meter{padding:16px;margin-top:16px}
.meter div{display:flex;justify-content:space-between;align-items:baseline}
.pct{display:block;font-size:calc(13px*var(--fs));color:var(--mute)}
.pct b{color:var(--blue);font-weight:600}
.meter .mm{display:block;flex:1;min-width:0}
.meter.w{display:flex;align-items:center;gap:14px}
.sip{white-space:nowrap;padding:10px 14px}
.bar{height:10px;background:var(--sky);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
label{display:grid;gap:4px;font-size:calc(13px*var(--fs));font-weight:500}
input,select,textarea{font:inherit;font-size:max(16px,calc(16px*var(--fs)));color:var(--ink);padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--mist);width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.btn.alt{background:var(--sky);color:var(--blue2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1}
.list{list-style:none;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.pg{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;touch-action:pan-x pan-y}
.pg::-webkit-scrollbar{display:none}
.pg.drag{cursor:grabbing;scroll-snap-type:none;user-select:none}
.pg>.list{flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;align-self:flex-start}
.pgi{display:flex;justify-content:center;gap:6px;margin-top:10px}
.pgi i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}
.pgi i.on{background:var(--blue);width:18px;border-radius:4px}
.list b{display:block;font-weight:600}
.list span{font-size:calc(13px*var(--fs))}
.x{border:0;background:none;font-size:calc(22px*var(--fs));color:var(--mute);cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);font-size:calc(14px*var(--fs));padding:4px 2px}
.link{background:none;border:0;color:var(--blue);font:inherit;font-size:calc(14px*var(--fs));cursor:pointer;padding:8px 0}
.auth{padding:56px 24px;text-align:center;max-width:420px;margin:auto}
.auth img{width:96px;height:auto}
.auth form{display:grid;gap:12px;text-align:left;margin-top:24px}
.err{color:var(--bad);font-size:calc(14px*var(--fs));min-height:20px}
.foot{font-size:calc(12px*var(--fs));color:var(--mute);margin-top:28px;text-align:center}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav div{display:flex}
nav button{flex:1;border:0;background:none;font:inherit;font-size:calc(11px*var(--fs));color:var(--mute);display:grid;justify-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--blue);font-weight:600}
nav .on svg{stroke-width:2.3}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--mist);padding:10px 16px;border-radius:12px;font-size:calc(14px*var(--fs));opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
label[hidden]{display:none}
.cb{position:relative}
.fl{list-style:none;padding:4px;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;max-height:240px;overflow:auto;z-index:5;box-shadow:0 8px 24px rgba(11,37,69,.14)}
.fl[hidden]{display:none}
.fl button{width:100%;text-align:left;background:none;border:0;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink)}
.fl button:hover,.fl button:focus-visible{background:var(--sky)}
.brand{display:none}
.dlg{position:fixed;inset:0;background:rgba(11,37,69,.45);display:grid;place-items:center;padding:20px;z-index:10}
.dlg form{background:var(--card);border-radius:18px;padding:20px;max-width:380px;width:100%;display:grid;gap:14px;max-height:92vh;overflow:auto}
.dlg p{font-weight:600}
.g2{display:grid;gap:0 16px}
.dt{display:flex;justify-content:flex-end;align-items:center;margin-top:22px}
.dt h2{margin:0}
.rst{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--mute);cursor:pointer}
.rst:hover{color:var(--blue);border-color:var(--blue)}
.rst svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sm{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 22px;margin-top:12px}
.rg{position:relative;width:112px;height:112px;flex:none}
.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:11}
.rg .t{stroke:var(--sky)}.rg .p{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .5s}
.rg div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:"Iowan Old Style",Georgia,serif;font-weight:600;font-size:calc(26px*var(--fs));line-height:1}
.rg small{display:block;font:500 calc(11px*var(--fs)) system-ui,sans-serif;color:var(--mute);margin-top:3px}
.sm h3{font:600 calc(17px*var(--fs)) "Iowan Old Style",Georgia,serif;margin:0}
.sm p{font-size:calc(14px*var(--fs));color:var(--mute);margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;font-size:calc(12px*var(--fs));font-weight:500;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 13%,transparent);color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:2px}

.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);flex:none}

.dc .ic{width:auto;height:auto;border-radius:0;background:none}
.dc .ic svg{width:20px;height:20px}
.dl{font-size:calc(13px*var(--fs));font-weight:500;color:var(--mute)}
.dn{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-weight:600;font-size:calc(20px*var(--fs));line-height:1.15}
.dn small{font:400 calc(12px*var(--fs)) system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--mute)}
.dc .bar{margin:6px 0 2px;background:color-mix(in srgb,var(--ac) 14%,transparent)}
.dc .bar i{background:var(--ac)}
.dc .qa{margin-top:auto;align-self:stretch;font:inherit;font-weight:600;font-size:calc(13px*var(--fs));background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);border:0;border-radius:10px;padding:10px 12px;cursor:pointer}
.dc .qa:active{opacity:.7}
.twb{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:12px}
.tw{width:100%;border-collapse:collapse;font-size:calc(13px*var(--fs));white-space:nowrap}
.tw th,.tw td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
.tw th:nth-child(-n+3),.tw td:nth-child(-n+3){text-align:left}
.tw th{position:sticky;top:0;background:var(--card);color:var(--mute);font-weight:500;z-index:1}
.tw tr:last-child td{border-bottom:0}
.tw tr.cur td{background:color-mix(in srgb,var(--c-if) 12%,var(--card));font-weight:600}
.sh2{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sh2 .num{font-size:calc(34px*var(--fs));color:var(--blue)}
.sm .bar{height:6px;margin:12px 0 8px}
.rl{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.rl li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:calc(14px*var(--fs))}
.rl li:nth-child(-n+2){border-top:0}
.rl li span{color:var(--mute)}
.rl b{font-weight:600;text-align:right}
.rl small{font-weight:400;color:var(--mute);font-size:calc(12px*var(--fs));margin-left:6px}
@media(max-width:600px){.sm{padding:16px}.rl{column-gap:18px}.rl li{font-size:calc(13px*var(--fs));gap:2px 6px;flex-wrap:wrap}}
@media(max-width:600px){.dg{grid-template-columns:1fr}}
.tgt{font-size:calc(12px*var(--fs));color:var(--mute);opacity:.7;white-space:nowrap;align-self:flex-end}
.ifq{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:6px}.ifq .qa{margin-top:0}.ifq input{font:inherit;font-size:calc(14px*var(--fs));color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}.ifq input:focus{outline:0;border-color:var(--ac)}.ifq label{display:flex;align-items:center;gap:8px;font-size:calc(12px*var(--fs));color:var(--mute)}.ifq label input{flex:1}.ifm{font-size:calc(12px*var(--fs));color:var(--mute);line-height:1.45}.ifm b{color:var(--ink);font-weight:600}
.lp{font-size:calc(12px*var(--fs));color:var(--mute);line-height:1.3;white-space:nowrap}.lp b{font-weight:500;color:var(--mute)}
.dc .qf{display:flex;gap:8px;margin-top:auto;padding-top:6px}.dc .qf input{flex:1;min-width:0;width:100%;font:inherit;font-size:calc(14px*var(--fs));color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px}.dc .qf input:focus{outline:0;border-color:var(--ac)}.dc .qf .qa{margin-top:0;white-space:nowrap}
.dc .qr{display:flex;gap:8px;margin-top:auto;padding-top:6px}.dc .qr .qa{flex:1;margin-top:0;padding:10px 6px}
.dc p{font-size:calc(12px*var(--fs));color:var(--mute);line-height:1.4}
.ht3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 0;width:100%}
.ht{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px;font:inherit;color:var(--ink);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;padding:16px;min-width:0;overflow:hidden;box-shadow:0 1px 2px rgba(11,37,69,.04);transition:transform .15s,box-shadow .15s,border-color .15s}
.ht::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--ac);opacity:.85}
.ht:hover,.ht:focus-visible{border-color:var(--ac);box-shadow:0 6px 18px rgba(11,37,69,.08);transform:translateY(-2px)}
.ht:active{transform:none}
.ht .ic{width:auto;height:auto;border-radius:0;background:none;margin-bottom:10px}
.ht .ic svg{width:30px;height:30px}
.ht .hl{font-size:calc(15px*var(--fs));font-weight:700}
.ht .hs{font-size:calc(12px*var(--fs));color:var(--mute);line-height:1.35}
.ht .hb{width:100%;height:5px;border-radius:99px;margin-top:8px;background:color-mix(in srgb,var(--ac) 14%,transparent);overflow:hidden}

@media(max-width:700px){.ht3{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(max-width:520px){.ht{padding:14px}.ht .ic svg{width:26px;height:26px}.ht .hl{font-size:calc(14px*var(--fs))}}
.pn{display:grid;gap:12px;margin-top:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.pc h3{font:600 calc(16px*var(--fs)) "Iowan Old Style",Georgia,serif;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:calc(13px*var(--fs));font-weight:500;border:0;border-radius:99px;padding:6px 14px;cursor:pointer;background:var(--sky);color:var(--blue2)}

.tb{position:relative;height:130px;display:flex;gap:8px;align-items:flex-end}
.tb div{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.tb i{display:block;width:100%;max-width:38px;border-radius:9px 9px 4px 4px;background:color-mix(in srgb,var(--ac) 40%,transparent);min-height:3px}

.tg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--mute);opacity:.55;pointer-events:none}
.tl{display:flex;gap:8px;margin-top:6px}
.tl span{flex:1;text-align:center;font-size:calc(11px*var(--fs));color:var(--mute)}

.ts{font-size:calc(13px*var(--fs));color:var(--mute);margin-top:12px}
.ac{list-style:none;padding:0;display:grid;gap:12px}
.ac li{display:flex;align-items:center;gap:12px}
.ac .ic{width:34px;height:34px;border-radius:10px}
.ac b{display:block;font-weight:600;font-size:calc(14px*var(--fs))}
.ac span{font-size:calc(12px*var(--fs));color:var(--mute)}
.hg{display:grid;gap:14px;margin-top:18px}

}

.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cg>span{text-align:center;font-size:calc(11px*var(--fs));color:var(--mute);padding-bottom:2px}
.cd{height:34px;display:grid;place-items:center;font:500 calc(12px*var(--fs)) system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:none;border:1.5px solid transparent;border-radius:8px;padding:0;cursor:pointer;min-width:0}
.cd.e{cursor:default}
.cd.h{background:var(--ac);color:#fff}
.cd.hp{background:color-mix(in srgb,var(--ac) 14%,transparent);border:1.5px dashed var(--ac)}
.cd.o{background:var(--ac);color:#fff}
.cd.fo,.cd.l{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.cd.sf{box-shadow:inset 0 -3px 0 var(--c-kcal)}
.cd.td{font-weight:700;outline:1.5px solid var(--ink);outline-offset:0}
.cd.sl{border-color:var(--blue)}
.cd.pp{background:var(--c-pup);color:#fff;position:relative}
.cd.sl.pp:not(.h):not(.o){background:var(--c-pup)}
.cal.pc{max-width:none;width:100%;box-sizing:border-box;margin:14px 0 0;padding:18px}
.cal.pc .cg{gap:6px}
.cal.pc .cd{height:calc(56px*var(--fs));font-size:calc(16px*var(--fs));border-radius:12px}
.cal.pc .cg>span{font-size:calc(12px*var(--fs));padding-bottom:4px}
@media(max-width:600px){.cal.pc{padding:12px}.cal.pc .cg{gap:4px}.cal.pc .cd{height:calc(44px*var(--fs));font-size:calc(14px*var(--fs))}}
:root[data-theme=dark] .cd.pp{color:#0E1726}
.cd.sl:not(.h):not(.o){background:var(--sky)}
.cdt{margin-top:10px;font-size:calc(13px*var(--fs));background:var(--sky);border-radius:12px;padding:10px 12px}
.cgd{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cgd .chip i.d{background:none;border:1.5px dashed var(--ac)}
.cgd .chip i.b{border-radius:2px;height:4px;width:12px}
.mc{margin-top:14px;display:grid;gap:4px}
.mc .mh{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.mc .mh span{font-size:calc(12px*var(--fs));color:var(--mute)}
.mc .mh b{font-size:calc(11px*var(--fs));font-weight:600;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);white-space:nowrap}
.mc svg{width:100%;height:auto;display:block;overflow:visible}
.mc .ln{fill:none;stroke:var(--ac);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mc .hl{fill:var(--ac);opacity:.18}
.mc .dt{fill:var(--ac)}
.mc .tx{font-size:12px;font-weight:700;fill:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mc .tl2{display:flex;justify-content:space-between}
.mc .tl2 span{flex:1;text-align:center;font-size:calc(10px*var(--fs));color:var(--mute)}
.mc .tl2 span.now{color:var(--ink);font-weight:600}
.sb{display:flex;align-items:center;gap:10px;margin-top:6px}
.sb .bt{flex:1;height:6px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);overflow:hidden}
.sb .bt i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .4s}
.sb span{font-size:calc(12px*var(--fs));font-weight:600;color:var(--ac);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.ck{margin:14px 0 6px}
.ck .kt,.ck .kx{position:relative;height:16px}
.ck .kt span,.ck .kx span{position:absolute;transform:translateX(-50%);font-size:calc(11px*var(--fs));white-space:nowrap}
.ck .kt span{font-weight:700;color:var(--ink);top:0}
.ck .kx span{color:var(--mute);top:2px;font-size:calc(10px*var(--fs))}
.ck .kx span.kf{transform:none}.ck .kx span.ke{transform:translateX(-100%)}
.ck .kb{position:relative;height:16px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);margin:4px 0}
.ck .kb i{position:absolute;top:0;bottom:0;background:var(--ac);border-radius:99px}
.ck .kn{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--card);border:3px solid var(--ink);box-shadow:0 1px 4px rgba(11,37,69,.25)}
.ck .kl{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:10px;font-size:calc(12px*var(--fs));color:var(--mute)}
.ck .kl span{display:flex;align-items:center;gap:6px}
.ck .kl i{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}
.ck .kl i.kp{background:color-mix(in srgb,var(--ac) 22%,transparent)}
.ck .kl i.kw{background:var(--card);border:2.5px solid var(--ink);width:12px;height:12px}
.wy{margin-top:14px}
.wy .wr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wy button{font:inherit;background:none;border:0;padding:4px 0;display:grid;justify-items:center;gap:5px;cursor:pointer;color:var(--ink)}
.wy small{font-size:calc(10px*var(--fs));color:var(--mute)}
.wy b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:calc(13px*var(--fs))}
.wy .now small{color:var(--ink);font-weight:700}
.wy .now b{background:var(--ink);color:var(--card);font-weight:700}
.wy i{width:6px;height:6px;border-radius:50%;background:var(--ac)}
.wy i.hl{background:none;border:1.5px dashed var(--ac)}
.wy .no i{visibility:hidden}
.dr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lg2{display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:flex-end;font-size:calc(12px*var(--fs));color:var(--mute);min-width:0}
.lg2 span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.lg2 i{width:7px;height:7px;border-radius:50%;background:var(--ac);flex:none}
.lg2 i.hl{background:none;border:1.5px dashed var(--ac)}
.dlb{background:none;border:0;padding:0;font:inherit;font-size:calc(13px*var(--fs));font-weight:500;color:var(--mute);cursor:pointer;text-align:left}
.dlb:hover{color:var(--ac);text-decoration:underline}
.dc{position:relative}
.dc .rs{position:absolute;top:10px;right:10px;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--mute);cursor:pointer;padding:0}
.dc .rs:hover{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.dc .rs svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=s=>document.querySelector(s);
document.querySelector('link[rel=icon]').href=LOGO;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY=()=>ymd(new Date());
const dd=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const addD=(s,n)=>new Date(Date.parse(s)+n*864e5).toISOString().slice(0,10);
const iso2id=s=>s?s.split('-').reverse().join('/'):'';
const id2iso=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s||'').trim());if(!m)return null;
  const dt=new Date(`${m[3]}-${m[2]}-${m[1]}T12:00`);
  return dt.getFullYear()==m[3]&&dt.getMonth()+1==+m[2]&&dt.getDate()==+m[1]?`${m[3]}-${m[2]}-${m[1]}`:null};
const fd=iso2id;
const ft=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const when=l=>(l.date===TODAY()?'Hari ini':fd(l.date))+', '+ft(l.ts);
const fv=e=>Object.fromEntries(new FormData(e.target));
const goal=Object.assign({kcal:2000,water:2000,wmin:30,wkcal:200},JSON.parse(localStorage.getItem('ec_goal')||'{}'));
const ui=Object.assign({theme:'light',fs:'m'},JSON.parse(localStorage.getItem('ec_ui')||'{}'));
const FS={s:.9,m:1,l:1.15,xl:1.3},mq=matchMedia('(prefers-color-scheme: dark)');
function applyUi(){const dk=ui.theme==='dark'||(ui.theme==='auto'&&mq.matches),r=document.documentElement;
  r.dataset.theme=dk?'dark':'light';r.style.setProperty('--fs',FS[ui.fs]||1);
  document.querySelector('meta[name=theme-color]').content=dk?'#0E1726':'#1565C0'}
mq.addEventListener('change',()=>{if(ui.theme==='auto')applyUi()});
applyUi();

let user=null,logs=[],tab='home',unsub=null,signup=false,authErr='';
const A=window.A={};
const ofType=(...t)=>logs.filter(l=>t.includes(l.type));
const fmGap=ms=>{const m=Math.max(0,Math.floor(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60),n=m%60;
  return d>0?d+' Hari '+h+' Jam':h>0?h+' Jam '+n+' Menit':n+' Menit'};
const lastPupHtml=()=>{const a=ofType('pup').map(l=>+l.ts||0).filter(Boolean),ts=a.length?Math.max(...a):0;
  return`<span class="lp" data-ts="${ts}"><b>${ts?fmGap(Date.now()-ts):'Belum ada data'}</b></span>`};
setInterval(()=>{document.querySelectorAll('.lp[data-ts]').forEach(e=>{const t=+e.dataset.ts;if(t){const b=e.querySelector('b');if(b)b.textContent=fmGap(Date.now()-t)}})},30000);
const sum=(t,k,date=TODAY())=>ofType(t).filter(l=>l.date===date).reduce((a,l)=>a+(+l[k]||0),0);

function ask(msg,fields,ok='OK',fn){return new Promise(res=>{
  const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<form><p>${msg}</p>${fields||''}<div class="row"><button type="button" class="btn alt" data-n>Batal</button><button class="btn">${ok}</button></div></form>`;
  document.body.appendChild(d);const done=v=>{d.remove();res(v)};
  d.querySelector('[data-n]').onclick=()=>done(null);
  d.onclick=e=>{if(e.target===d)done(null)};
  if(fn)d.querySelector('form').addEventListener('input',e=>fn(e.currentTarget,e));
  d.querySelector('form').onsubmit=e=>{e.preventDefault();done(Object.fromEntries(new FormData(e.target)))};
  const i=d.querySelector('input');i?i.focus():d.querySelector('.btn:not(.alt)').focus()})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
const col=()=>collection(db,'users',user.uid,'logs');
const add=(type,o)=>run(()=>addDoc(col(),{type,date:TODAY(),ts:Date.now(),...o}));
async function run(f){try{await f()}catch(e){toast('Gagal menyimpan. Periksa aturan Firestore.')}}

/* ---------- Auth ---------- */
const ERR={'auth/invalid-credential':'Email atau kata sandi salah.','auth/invalid-email':'Format email tidak valid.','auth/email-already-in-use':'Email sudah terdaftar. Silakan masuk.','auth/weak-password':'Kata sandi minimal 6 karakter.','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti.','auth/network-request-failed':'Tidak ada koneksi internet.'};
function authView(){
  $('#app').innerHTML=`<div class="auth"><img src="${LOGO}" alt="Essencare"><h1 style="margin-top:14px">Essencare</h1>
  <p class="mute">Catat kesehatanmu dengan tenang.</p>
  <form onsubmit="return A.auth(event)">
  <label>Email<input name="e" type="email" autocomplete="email" required></label>
  <label>Kata sandi<input name="p" type="password" autocomplete="${signup?'new':'current'}-password" minlength="6" required></label>
  <p class="err" role="alert">${esc(authErr)}</p>
  <button class="btn">${signup?'Buat akun':'Masuk'}</button>
  <button type="button" class="link" onclick="A.mode()">${signup?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button>
  ${signup?'':'<button type="button" class="link" onclick="A.reset()">Lupa kata sandi</button>'}
  </form></div>`;
}
A.mode=()=>{signup=!signup;authErr='';authView()};
A.auth=async e=>{e.preventDefault();const f=fv(e);authErr='';
  try{await(signup?createUserWithEmailAndPassword:signInWithEmailAndPassword)(auth,f.e,f.p)}
  catch(x){authErr=ERR[x.code]||'Terjadi kesalahan. Coba lagi.';authView();$('input[name=e]').value=f.e}
  return false};

const PLAN_W0=60,PLAN_W1=50;
const planOn=()=>goal.plan!==false;
function planDay(d){
  const i=PLAN.findIndex(w=>d>=w[0]&&d<=addD(w[0],6));if(i<0)return null;
  const w=PLAN[i],prev=i?PLAN[i-1][6]:PLAN_W0,n=dd(d,w[0]),step=(w[6]-prev)/7;
  return{i,n:i+1,ratio:w[1],ws:w[2],we:w[3],extra:w[4],intake:w[5],tw:prev+step*(n+1),step};
}

const tmin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h?`${h} jam${r?` ${r} menit`:''}`:`${r} menit`};
function ifStatus(p){const n=new Date(),now=n.getHours()*60+n.getMinutes(),a=tmin(p.ws),b=tmin(p.we);
  if(now>=a&&now<b)return`Sedang jendela makan, tutup pukul ${p.we} (${dur(b-now)} lagi).`;
  return`Sedang puasa, jendela makan buka pukul ${p.ws} (${dur(now<a?a-now:1440-now+a)} lagi).`}
function ifClock(p){

  const segs=b>a?[[a,b]]:[[0,b],[a,1440]],ed=b>a?[a,b]:[b,a];
  const tk=[[0,'00','kf'],[360,'06',''],[720,'12',''],[1080,'18',''],[1440,'24','ke']];
  return`<div class="ck" role="img" aria-label="Jendela makan ${p.ws} sampai ${p.we}, sekarang ${hh(now)}"><div class="kt">${ed.map(m=>`<span style="left:${Math.min(94,Math.max(6,m/14.4)).toFixed(2)}%">${hh(m)}</span>`).join('')}</div><div class="kb">${segs.map(x=>`<i style="left:${pc(x[0])}%;width:${pc(x[1]-x[0])}%"></i>`).join('')}<span class="kn" style="left:${pc(now)}%"></span></div><div class="kx">${tk.map(t=>`<span class="${t[2]}" style="left:${pc(t[0])}%">${t[1]}</span>`).join('')}</div></div>`}
const hhm=m=>{m=(Math.round(m)%1440+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const ifMin=(d,k)=>{const a=ofType('ifmeal').filter(l=>l.date===d&&l.kind===k).sort((a,b)=>(b.at||0)-(a.at||0))[0];return a?a.min:null};
function ifRec(){
  const t=TODAY(),p=planDay(t);if(!p)return null;
  const q=planDay(addD(t,1))||p;
  let wl=tmin(q.we)-tmin(q.ws);if(wl<=0)wl+=1440;
  let pw=tmin(p.we)-tmin(p.ws);if(pw<=0)pw+=1440;
  const n=new Date();
  return{p,q,wl,pw,fast:1440-wl,latest:tmin(q.ws)+wl,first:ifMin(t,'first'),last:ifMin(t,'last'),now:n.getHours()*60+n.getMinutes()}}
function ifMsg(r){
  const a=`Pertama <b>${r.first==null?'-':hhm(r.first)}</b> · Terakhir <b>${r.last==null?'-':hhm(r.last)}</b>`;
  let s;
  if(r.last!=null){
    const sl=r.latest-r.last;
    s=sl>=0?`Besok bisa mulai tepat <b>${r.q.ws}</b>.`:`Lewat ${dur(-sl)} dari batas. Besok mulai paling cepat <b>${hhm(r.last+r.fast)}</b> agar puasa penuh.`}
  else if(r.now<r.latest){
    s=`Berhenti makan maks. <b>${hhm(r.latest)}</b> (${dur(r.latest-r.now)} lagi) agar besok tepat ${r.q.ws}.`;

function ifLog(){const r=ifRec();if(!r)return'';
  const t=TODAY(),rows=Array.from({length:7},(_,i)=>addD(t,-i)).map(d=>{

}

function calc(f,e){
  if(e&&(e.target.name==='k'||e.target.name==='w'))return;
  const E=f.elements,a=+E.a.value,h=+E.h.value,b=+E.b.value,o=f.querySelector('#cr');
  if(!(a>0&&h>0&&b>0)){o.textContent='Isi usia, tinggi, dan berat untuk menghitung otomatis.';return}
  const bmr=10*b+6.25*h-5*a+(E.s.value==='p'?5:-161),g=+E.tj.value;
  let t=bmr*+E.act.value;t=g<0?Math.max(t+g,bmr):t+g;t=Math.round(t/10)*10;
  E.k.value=t;E.w.value=Math.round(Math.min(3000,Math.max(1500,b*30))/50)*50;

function phs(c,Lx,Mx){

  M=Mx?Math.min(O-1,Math.max(1,Mx)):Math.min(O-1,Math.min(8,Math.max(3,M)));
  const s=[{n:'Menstruasi (haid)',ac:'c-cycle',a:1,b:M,t:'Dinding rahim luruh dan keluar sebagai darah haid. Hari pertama haid adalah hari ke-1 siklus.'}];
  if(M+1<=O-1)s.push({n:'Fase folikuler',ac:'c-water',a:M+1,b:O-1,t:'Haid selesai, hormon estrogen naik dan folikel di ovarium matang untuk melepas sel telur.'});
  s.push({n:'Ovulasi',ac:'c-work',a:O,b:O,t:'Sel telur dilepas dari ovarium dan hidup sekitar 12 sampai 24 jam. Perkiraan berdasarkan 14 hari sebelum haid berikutnya.'});
  s.push({n:'Fase luteal',ac:'c-lut',a:O+1,b:L,t:'Hormon progesteron naik untuk menyiapkan rahim. Jika tidak terjadi pembuahan, hormon turun dan haid dimulai. Gejala PMS biasa muncul di akhir fase ini.'});
  return{s,L,O,f:{n:'Masa subur',ac:'c-kcal',a:O-5,b:O+1,t:'Sperma dapat bertahan hingga sekitar 5 hari, sehingga peluang hamil ada pada 5 hari sebelum ovulasi sampai 1 hari sesudahnya. Peluang tertinggi 1 sampai 2 hari sebelum ovulasi.'}};
}
function dayCat(d){

}

function pupCal(){
  const[y,m]=pcm.split('-').map(Number),first=new Date(y,m-1,1),off=(first.getDay()+6)%7,nd=new Date(y,m,0).getDate(),t=TODAY();
  const cnt={};ofType('pup').forEach(l=>{cnt[l.date]=(cnt[l.date]||0)+1});
  const cells=[];for(let i=0;i<off;i++)cells.push('<span></span>');
  let days=0;
  for(let n=1;n<=nd;n++){
    const d=`${pcm}-${String(n).padStart(2,'0')}`,cl=['cd'];
    if(cnt[d]){cl.push('pp');days++}else cl.push('e');
    if(d===t)cl.push('td');if(d===pcsel)cl.push('sl');
    cells.push(`<button type="button" class="${cl.join(' ')}" onclick="A.pcsel('${d}')" aria-label="${fd(d)}${cnt[d]?', sudah pup':''}">${n}</button>`)}
  return`<div class="cal pc"><div class="clh"><button class="rst" onclick="A.pcmon(-1)" aria-label="Bulan sebelumnya">‹</button><b>${first.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button class="rst" onclick="A.pcmon(1)" aria-label="Bulan berikutnya">›</button></div>
  <div class="cg">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<span>${x}</span>`).join('')}${cells.join('')}</div>
</div>`
}
function vPup(){
  const a=ofType('pup'),t=a.filter(l=>l.date===TODAY());
  return`<h1>Pup</h1><p class="mute">Hari ini: ${t.length} kali pup</p>
  <form class="f" onsubmit="return A.pup(event)"><button class="btn">Catat pup</button></form>
  ${pupCal()}
  <h2>Riwayat</h2>${pgList(a,l=>li(l,'Pup',`${l.bristol?'Tipe '+l.bristol+': '+BR[l.bristol-1]+', ':''}${when(l)}`),'Belum ada catatan.')}`;
}

const TABS=[['home','Beranda','<path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-7h6v7"/>'],
['health','Kesehatan','<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>'],
['analysis','Analisis','<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>'],
['settings','Setting','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>']];

function vBB(){
  const t=TODAY(),by={};
  ofType('weight').forEach(l=>{if(!by[l.date]||l.ts>by[l.date].ts)by[l.date]=l});
  const days=Object.keys(by).sort(),first=days.length?by[days[0]]:null,last=days.length?by[days[days.length-1]]:null,pd=planDay(t);
  const vs=days.map(d=>by[d].kg),total=last?PLAN_W0-last.kg:null;
  const span=days.length>1?dd(last.date,first.date):0,rate=span>=7?(last.kg-first.kg)/(span/7):null;
  const sg=x=>(x>0?'+':x<0?'-':'')+f2(Math.abs(x));
  const kv=(a,b)=>`<div class="kv"><span>${a}</span><span>${b}</span></div>`;
  const dtg=last&&pd?last.kg-pd.tw:null;
  const rows=[
    kv('Berat terakhir',last?`${fk(last.kg)} kg (${fd(last.date)})`:'Belum ada data'),
    kv('Target hari ini',pd?`${f2(pd.tw)} kg`:'-'),
    kv('Selisih dari target',dtg===null?'-':Math.abs(dtg)<0.005?'Tepat sesuai target':`${f2(Math.abs(dtg))} kg ${dtg>0?'di atas':'di bawah'} target`),
    kv(`Perubahan dari ${PLAN_W0} kg`,total===null?'-':total>=0?`Turun ${f2(total)} kg`:`Naik ${f2(-total)} kg`),
    kv('Rata-rata per minggu',rate===null?'Belum cukup data':`${sg(rate)} kg`),
    kv('Terendah / tertinggi',vs.length?`${fk(Math.min(...vs))} / ${fk(Math.max(...vs))} kg`:'-'),
    kv('Hari tercatat',`${days.length} hari`)].join('');
  let wk='';
  if(pd){const L=[];for(let i=pd.i;i>=Math.max(0,pd.i-7);i--){
    const w=PLAN[i],e=addD(w[0],6),ds=days.filter(d=>d>=w[0]&&d<=e),a=ds.length?by[ds[ds.length-1]]:null;
    L.push(`<li><div><b>Minggu ${i+1}${i===pd.i?' (berjalan)':''}</b><span>${fd(w[0]).slice(0,5)}–${fd(e).slice(0,5)}: target akhir ${f2(w[6])} kg, ${a?`aktual ${fk(a.kg)} kg (${sg(a.kg-w[6])} kg dari target)`:'aktual belum dicatat'}</span></div></li>`)}
    wk=`<h2>Rekap mingguan</h2><ul class="list">${L.join('')}</ul>`}
  return`<div class="top"><h1>Diet</h1></div>
  <form class="f fd" onsubmit="return A.weight(event)"><label>Berat badan hari ini (kg)<input name="w" type="text" inputmode="decimal" autocomplete="off" maxlength="6" oninput="A.dec(this)" placeholder="00,00" value="${last?fk(last.kg):''}" required></label><button class="btn">Simpan berat badan</button></form>
  <h2>Rekap berat badan</h2>
  <section class="pc">${rows}${bar(Math.max(0,Math.round((total||0)*100)/100),PLAN_W0-PLAN_W1,'Penurunan menuju '+PLAN_W1+' kg','kg')}</section>
  <h2>Rekomendasi target</h2>${recBB()}
  <h2>Grafik berat badan</h2>
  <div class="seg">${[7,30,90].map(n=>`<button class="btn${wr===n?'':' alt'}" onclick="A.wr(${n})">${n} hari</button>`).join('')}</div>
  <section class="pc" style="margin-top:14px">${wChart()}</section>
  ${wk}
  <h2>Riwayat berat badan</h2>${list(ofType('weight'),l=>li(l,`${fk(l.kg)} kg`,when(l)),'Belum ada catatan berat badan.')}`;
}
A.setH=e=>{e.preventDefault();const h=Math.round(+fv(e).h*10)/10;
  if(!(h>=100&&h<=250)){toast('Isi tinggi badan antara 100 dan 250 cm.');return false}
  goal.p=Object.assign({},goal.p,{h:String(h)});localStorage.setItem('ec_goal',JSON.stringify(goal));render();toast('Tinggi badan tersimpan');return false};
function recBB(){
  const h=+((goal.p||{}).h)||0,last=ofType('weight')[0],cur=last?last.kg:PLAN_W0;
  const kv=(a,b)=>`<div class="kv"><span>${a}</span><span>${b}</span></div>`;
  const form=`<form class="f" style="margin-top:12px" onsubmit="return A.setH(event)"><label>Tinggi badan (cm)<input name="h" type="number" inputmode="decimal" min="100" max="250" step="0.1" value="${h||''}" placeholder="Contoh: 160" required></label><button class="btn">${h?'Perbarui tinggi':'Hitung rekomendasi'}</button></form>`;
  if(!h)return`<section class="pc"><p class="mute" style="margin:0">Isi tinggi badanmu untuk melihat rentang berat badan sehat, target yang disarankan, dan kecepatan turun yang aman.</p>${form}</section>`;
  const m=h/100,m2=m*m,lo=18.5*m2,hi=22.9*m2,tg=Math.round((lo+hi)/2*2)/2,bmi=cur/m2,bp=PLAN_W1/m2;
  const bk=bmi<18.5?'di bawah normal':bmi<=22.9?'normal':bmi<=24.9?'berlebih':'obesitas';
  let body='';
  if(cur<=hi){
    body=`<p class="note" style="margin-top:12px">Berat badanmu ${fk(cur)} kg (BMI ${f2(bmi)}, ${bk}) sudah ${bmi<18.5?'di bawah':'dalam'} rentang sehat. ${bmi<18.5?'Penurunan lagi tidak disarankan. Konsultasikan ke dokter atau ahli gizi.':'Fokus menjaga berat badan, bukan menurunkannya lagi.'}</p>`;
  }else{
    const loss=cur-tg,w1=loss/0.5,w2=loss/0.25,st=cur*0.95,def=r=>Math.round(r*7700/7/10)*10;
    body=kv('Berat sekarang',`${fk(cur)} kg (BMI ${f2(bmi)}, ${bk})`)
    +kv('Target yang disarankan',`${fk(tg)} kg`)
    +kv('Total yang perlu turun',`${fk(loss)} kg`)
    +(st>tg?kv('Target bertahap pertama',`${fk(st)} kg (turun 5%)`):'')
    +kv('Kecepatan aman',`0,25 sampai 0,5 kg per minggu`)
    +kv('Defisit kalori harian',`sekitar ${def(0.25)} sampai ${def(0.5)} kkal`)
    +kv('Perkiraan waktu',`${Math.ceil(w1)} sampai ${Math.ceil(w2)} minggu`)
    +kv('Perkiraan tercapai',`${fd(addD(TODAY(),Math.ceil(w1*7)))} s.d. ${fd(addD(TODAY(),Math.ceil(w2*7)))}`);
  }
  const rate=(PLAN_W0-PLAN_W1)/PLAN.length;
  const pv=PLAN_W1<lo?`Target ${PLAN_W1} kg di jadwalmu (BMI ${f2(bp)}) berada di bawah batas sehat untuk tinggi ${h} cm. Pertimbangkan menaikkan target atau konsultasi ke dokter.`:PLAN_W1<=hi?`Target ${PLAN_W1} kg di jadwalmu (BMI ${f2(bp)}) berada dalam rentang sehat.`:`Target ${PLAN_W1} kg di jadwalmu (BMI ${f2(bp)}) masih di atas rentang sehat.`;
  const pr=`Kecepatan jadwalmu rata-rata ${f2(rate)} kg per minggu, ${rate>0.5?'di atas':rate<0.25?'di bawah':'masih dalam'} batas aman.`;
  return`<section class="pc">${kv('Tinggi badan',`${h} cm`)}${kv('Rentang berat sehat',`${fk(lo)} sampai ${fk(hi)} kg`)}${body}<p class="mute" style="margin:10px 0 0">${pv} ${pr}</p><p class="mute" style="margin:8px 0 0">Berdasarkan BMI normal Asia-Pasifik (18,5 sampai 22,9). Ini perkiraan umum dan bukan pengganti saran dokter, terutama bila hamil, menyusui, atau punya kondisi kesehatan.</p>${form}</section>`;
}
const SUB=['work','diet','bb','if','cycle','pee','pup'];
function twTable(p){
  const g=x=>Math.round(x*1000).toLocaleString('id-ID');
  const rows=PLAN.map((w,i)=>{const prev=i?PLAN[i-1][6]:PLAN_W0,e=addD(w[0],6);
    return`<tr class="${p&&p.i===i?'cur':''}"><td>${i+1}</td><td>${fd(w[0]).slice(0,5)}–${fd(e).slice(0,5)}</td><td>IF ${w[1]}, ${w[2]}–${w[3]}</td><td>${f2(w[6])}</td><td>${g(prev-w[6])}</td><td>${g(PLAN_W0-w[6])}</td></tr>`}).join('');
  return`<h2>Target turun berat badan</h2><section class="pc"><p class="mute" style="margin:0 0 12px">Target per minggu mengikuti jadwal IF. Turun per minggu dihitung dari target akhir minggu sebelumnya, dan total turun dihitung dari ${PLAN_W0} kg.</p>
  <div class="twb"><table class="tw"><thead><tr><th>Mgn</th><th>Tanggal</th><th>Jadwal IF</th><th>Target (kg)</th><th>Turun (g)</th><th>Total (g)</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
function vIF(){const p=planDay(TODAY());
  return`<h1>Puasa IF</h1>${p?`<section class="pc" style="margin-top:16px;--ac:var(--c-if)"><h3>Hari ini</h3>${ifClock(p)}</section>`:''}${ifLog()}${ifInfo()}${twTable(p)}`}
const V={home:vHome,health:vHealth,analysis:vAnalysis,settings:vSettings,work:vWork,diet:vDiet,bb:vBB,if:vIF,cycle:vCycle,pee:vPee,pup:vPup};

function render(){
  if(!user)return;
  $('#app').innerHTML=`<main>${SUB.includes(tab)?`<button class="link" style="padding:0 0 12px" onclick="A.go('health')">‹ Kesehatan</button>`:''}${V[tab]()}</main><nav><div class="brand"><img src="${LOGO}" alt="">Essencare</div><div>${TABS.map(([k,n,p])=>`<button class="${k===tab||(k==='health'&&SUB.includes(tab))?'on':''}" onclick="A.go('${k}')" ${k===tab?'aria-current="page"':''}><svg viewBox="0 0 24 24">${p}</svg>${n}</button>`).join('')}</div></nav>`;
}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script>
