function ask(msg,fields,ok='OK',fn){return new Promise(res=>{
  const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<form><p>${msg}</p>${fields||''}<div class="row"><button type="button" class="btn alt" data-n>Batal</button><button class="btn">${ok}</button></div></form>`;
  document.body.appendChild(d);const done=v=>{d.remove();res(v)};
  d.querySelector('[data-n]').onclick=()=>done(null);
  d.onclick=e=>{if(e.target===d)done(null)};
  if(fn)d.querySelector('form').addEventListener('input',e=>fn(e.currentTarget,e));
  d.querySelector('form').onsubmit=e=>{e.preventDefault();done(Object.fromEntries(new FormData(e.target)))};
  const i=d.querySelector('input');i?i.focus():d.querySelector('.btn:not(.alt)').focus()})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
const col=()=>collection(db,'users',user.uid,'logs');

const ERR={'auth/invalid-credential':'Email atau kata sandi salah.','auth/invalid-email':'Format email tidak valid.','auth/email-already-in-use':'Email sudah terdaftar. Silakan masuk.','auth/weak-password':'Kata sandi minimal 6 karakter.','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti.','auth/network-request-failed':'Tidak ada koneksi internet.'};
function authView(){
  $('#app').innerHTML=`<div class="auth"><img src="${LOGO}" alt="Essencare"><h1 style="margin-top:14px">Essencare</h1>
  <p class="mute">Catat kesehatanmu dengan tenang.</p>
  <form onsubmit="return A.auth(event)">
  <label>Email<input name="e" type="email" autocomplete="email" required></label>

  <button type="button" class="link" onclick="A.mode()">${signup?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button>
  ${signup?'':'<button type="button" class="link" onclick="A.reset()">Lupa kata sandi</button>'}

}
A.mode=()=>{signup=!signup;authErr='';authView()};
A.auth=async e=>{e.preventDefault();const f=fv(e);authErr='';

  catch(x){authErr=ERR[x.code]||'Terjadi kesalahan. Coba lagi.';authView();$('input[name=e]').value=f.e}
  return false};
A.reset=async()=>{const m=$('input[name=e]').value.trim();if(!m)return toast('Isi email dulu.');
  try{await sendPasswordResetEmail(auth,m);toast('Tautan reset dikirim ke email.')}catch(x){toast(ERR[x.code]||'Gagal mengirim tautan.')}};

onAuthStateChanged(auth,u=>{
  unsub&&unsub();unsub=null;user=u;logs=[];
  if(!u)return authView();
  unsub=onSnapshot(col(),s=>{logs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);render()},()=>toast('Data tidak bisa dimuat. Periksa aturan Firestore.'));

A.clearToday=async()=>{const t=logs.filter(l=>l.date===TODAY()&&l.type!=='period');
  if(!t.length)return toast('Belum ada catatan hari ini.');
  if(await ask(`Hapus ${t.length} catatan hari ini? Tindakan ini tidak bisa dibatalkan.`,0,'Reset'))
    run(async()=>{await Promise.all(t.map(l=>deleteDoc(doc(db,'users',user.uid,'logs',l.id))));toast('Data hari ini sudah direset.')})};
A.go=t=>{tab=t;render();scrollTo(0,0)};
A.del=async id=>{if(await ask('Hapus catatan ini?',0,'Hapus'))run(()=>deleteDoc(doc(db,'users',user.uid,'logs',id)))};
A.work=e=>{e.preventDefault();const f=fv(e);add('workout',{name:f.n,min:+f.m,kcal:+f.k||0});return false};
A.meal=e=>{e.preventDefault();const f=fv(e),p=+f.p||1;
  if(!f.n){toast('Pilih makanan dari daftar.');return false}
  add('meal',{name:f.n==='_'?f.x.trim():(p===1?f.n:`${f.n} ×${p}`),kcal:+f.k});return false};
A.water=ml=>add('water',{ml});
const SIP=30;
A.sip=()=>{add('water',{ml:SIP});toast(`+1 teguk (${SIP} ml)`)};
A.quick=t=>add(t,{});
A.pee=e=>{e.preventDefault();add('pee',{color:fv(e).c});return false};
A.pup=e=>{e.preventDefault();add('pup',{bristol:+fv(e).b});return false};
A.dmask=el=>{let v=el.value.replace(/\D/g,'').slice(0,8);
  if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);el.value=v};
A.period=e=>{e.preventDefault();const f=fv(e),d=id2iso(f.d),x=f.e?id2iso(f.e):'';
  if(!d||(f.e&&!x)){toast('Format tanggal harus dd/mm/yyyy.');return false}
  if(d>TODAY()||(x&&x>TODAY())){toast('Tanggal tidak boleh di masa depan.');return false}
  if(x&&x<d){toast('Tanggal selesai tidak boleh sebelum tanggal mulai.');return false}
  if(ofType('period').some(l=>l.start===d)){toast('Haid dengan tanggal mulai itu sudah tercatat.');return false}

A.end=id=>run(()=>updateDoc(doc(db,'users',user.uid,'logs',id),{end:TODAY()}));
const so=(a,c)=>a.map(([v,t])=>`<option value="${v}"${String(v)===String(c)?' selected':''}>${t}</option>`).join('');
function calc(f,e){
  if(e&&(e.target.name==='k'||e.target.name==='w'))return;
  const E=f.elements,a=+E.a.value,h=+E.h.value,b=+E.b.value,o=f.querySelector('#cr');
  if(!(a>0&&h>0&&b>0)){o.textContent='Isi usia, tinggi, dan berat untuk menghitung otomatis.';return}
  const bmr=10*b+6.25*h-5*a+(E.s.value==='p'?5:-161),g=+E.tj.value;
  let t=bmr*+E.act.value;t=g<0?Math.max(t+g,bmr):t+g;t=Math.round(t/10)*10;
  E.k.value=t;E.w.value=Math.round(Math.min(3000,Math.max(1500,b*30))/50)*50;
  o.textContent=`Kebutuhan dasar tubuh ${Math.round(bmr)} kkal. Saran: ${t} kkal dan ${E.w.value} ml air per hari.`}
A.goal=async()=>{const p=goal.p||{};

  <label>Aktivitas<select name="act">${so([[1.2,'Duduk seharian, jarang olahraga'],[1.375,'Olahraga ringan 1-3 kali seminggu'],[1.55,'Olahraga 3-5 kali seminggu'],[1.725,'Sangat aktif']],p.act||1.2)}</select></label>
  <label>Tujuan<select name="tj">${so([[0,'Jaga berat badan'],[-400,'Turunkan berat badan'],[300,'Naikkan berat badan']],p.tj||0)}</select></label>
  <p id="cr" class="mute">Isi usia, tinggi, dan berat untuk menghitung otomatis.</p>
  <div class="two"><label>Target kalori (kkal)<input name="k" type="number" min="1" value="${goal.kcal}"></label><label>Target air (ml)<input name="w" type="number" min="1" value="${goal.water}"></label></div>`,'Simpan',calc);
  if(!r)return;const k=parseInt(r.k),w=parseInt(r.w),b=parseFloat(r.b);

A.wgoal=async()=>{
  const r=await ask('Target olahraga harian',`<div class="two"><label>Durasi (menit)<input name="m" type="number" min="1" value="${goal.wmin}"></label><label>Kalori terbakar (kkal)<input name="k" type="number" min="1" value="${goal.wkcal}"></label></div>`,'Simpan');

function cyc(){
  const p=ofType('period').sort((a,b)=>a.start<b.start?-1:1);if(!p.length)return null;
  const last=p[p.length-1];let avg=28;
  if(p.length>1){const g=p.slice(1).map((x,i)=>dd(x.start,p[i].start));avg=Math.round(g.reduce((a,b)=>a+b,0)/g.length)}
  avg=Math.min(45,Math.max(21,avg));
  const next=addD(last.start,avg);
  return{last,avg,next,day:dd(TODAY(),last.start)+1,left:dd(next,TODAY()),open:!last.end&&dd(TODAY(),last.start)<10,n:p.length}
}
function cycText(c){
  if(!c)return'Belum ada data siklus. Catat hari pertama haidmu di tab Siklus.';
  if(c.open)return`Sedang haid, hari ke-${c.day}.`;
  return c.left>=0?`Haid berikutnya sekitar ${fd(c.next)}, ${c.left} hari lagi.`:`Haid terlambat ${-c.left} hari dari perkiraan.`
}

function phs(c,Lx,Mx){
  const L=Lx||c.avg,O=L-14;
  const done=ofType('period').filter(p=>p.end).map(p=>dd(p.end,p.start)+1).filter(x=>x>0&&x<=10);
  let M=done.length?Math.round(done.reduce((a,b)=>a+b,0)/done.length):5;
  M=Mx?Math.min(O-1,Math.max(1,Mx)):Math.min(O-1,Math.min(8,Math.max(3,M)));
  const s=[{n:'Menstruasi (haid)',ac:'c-cycle',a:1,b:M,t:'Dinding rahim luruh dan keluar sebagai darah haid. Hari pertama haid adalah hari ke-1 siklus.'}];
  if(M+1<=O-1)s.push({n:'Fase folikuler',ac:'c-water',a:M+1,b:O-1,t:'Haid selesai, hormon estrogen naik dan folikel di ovarium matang untuk melepas sel telur.'});
  s.push({n:'Ovulasi',ac:'c-work',a:O,b:O,t:'Sel telur dilepas dari ovarium dan hidup sekitar 12 sampai 24 jam. Perkiraan berdasarkan 14 hari sebelum haid berikutnya.'});
  s.push({n:'Fase luteal',ac:'c-lut',a:O+1,b:L,t:'Hormon progesteron naik untuk menyiapkan rahim. Jika tidak terjadi pembuahan, hormon turun dan haid dimulai. Gejala PMS biasa muncul di akhir fase ini.'});
  return{s,L,O,f:{n:'Masa subur',ac:'c-kcal',a:O-5,b:O+1,t:'Sperma dapat bertahan hingga sekitar 5 hari, sehingga peluang hamil ada pada 5 hari sebelum ovulasi sampai 1 hari sesudahnya. Peluang tertinggi 1 sampai 2 hari sebelum ovulasi.'}};
}
function dayCat(d){
  const ps=ofType('period').sort((a,b)=>a.start<b.start?-1:1),c=cyc();
  if(!c||d<ps[0].start)return null;
  let idx=0;ps.forEach((p,j)=>{if(p.start<=d)idx=j});
  const p=ps[idx];let st,L,M=p.end?dd(p.end,p.start)+1:0,pred=false;
  if(idx<ps.length-1){st=p.start;L=dd(ps[idx+1].start,p.start)}
  else{const n=Math.floor(dd(d,p.start)/c.avg);if(n>6)return null;st=addD(p.start,n*c.avg);L=c.avg;pred=n>0;if(pred)M=0}
  const day=dd(d,st)+1,Lc=Math.min(45,Math.max(21,L));
  if(day>Lc)return null;
  const q=phs(c,Lc,M),x=q.s.find(y=>day>=y.a&&day<=y.b);
  if(!x)return null;
  return{k:x===q.s[0]?'h':x.ac==='c-water'?'f':x.ac==='c-work'?'o':'l',n:x.n,ac:x.ac,day,fert:day>=q.f.a&&day<=q.f.b,est:pred||d>TODAY()}
}

  $('#app').innerHTML=`<main>${SUB.includes(tab)?`<button class="link" style="padding:0 0 12px" onclick="A.go('health')">‹ Kesehatan</button>`:''}${V[tab]()}</main><nav><div class="brand"><img src="${LOGO}" alt="">Essencare</div><div>${TABS.map(([k,n,p])=>`<button class="${k===tab||(k==='health'&&SUB.includes(tab))?'on':''}" onclick="A.go('${k}')" ${k===tab?'aria-current="page"':''}><svg viewBox="0 0 24 24">${p}</svg>${n}</button>`).join('')}</div></nav>`;
}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script>
</body>
</html>
